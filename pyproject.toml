[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opencsi"
version = "0.1.0"
description = "Standalone read-only CLI client for openCsiTool \"My Tools\" (我的工具)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "opencsi contributors" }]
keywords = ["opencsitool", "cli", "read-only", "cdp", "token-usage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

# Zero runtime dependencies: pure standard library.
# This is deliberate -- the tool must run anywhere Python 3.10+ exists,
# including air-gapped Windows machines with no package index access.
dependencies = []

[project.optional-dependencies]
# Optional: only needed if you want to run the test suite with pytest.
# The suite also runs on the standard library's unittest runner.
test = ["pytest>=7"]

# Displaying the login code for `opencsi login --qr`.
# Pillow is the only *required* piece: GitCode returns the code as an image, so
# the work is decoding and painting it, not encoding anything ourselves. Note
# that image is a WeChat mini-program code, not a QR code, so the terminal
# rendering is a preview and the saved file is what gets scanned -- see
# docs/gitcode-qr-protocol.md §9.0.
# segno is kept for the case where a payload turns out to be a string to encode
# rather than an image -- it is not needed for the flow GitCode actually
# implements, and the code says so instead of silently requiring it.
qr = ["Pillow>=10", "segno>=1.6"]

# Windows system tray. pystray wraps Shell_NotifyIcon and the message loop;
# Pillow draws the status icons.
tray = ["pystray>=0.19", "Pillow>=10"]

# Everything optional, for a workstation install.
all = ["Pillow>=10", "segno>=1.6", "pystray>=0.19"]

# Development-only: building the standalone EXE. Deliberately NOT a runtime
# dependency -- the shipped tool must run from a plain Python install.
build = ["pyinstaller>=6.0"]

[project.scripts]
opencsi = "opencsi.cli.app:main"
opencsi-monitor = "opencsi.tray.app:main"

[project.urls]
Documentation = "https://opencsitool.com/myTools"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["opencsi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
