name: CI

# What this workflow is for
# -------------------------
# It exists to catch the classes of breakage this project has actually suffered,
# not to produce a green badge. Three of those were invisible to a plain
# `pytest` run on one machine:
#
#   * the suite only ever ran under pytest, so anything unittest-specific (or any
#     reliance on pytest fixtures) went unnoticed;
#   * the frozen binaries were never executed, so a build that produced an EXE
#     which could not start still "passed";
#   * a probe script could be added that mutates state, and nothing checked.
#
# So each job below corresponds to a real defect rather than to a best practice.
#
# **No job needs credentials and no job touches the network.** Every test that
# would need a live session is stubbed or skipped, which is what lets this run on
# a fork with no secrets configured. A CI that required a real token would be a CI
# that nobody outside this machine could run.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the suite's own output stable across runners.
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"
  # Any accidental attempt to use a proxy in tests would be a bug; this makes it
  # fail loudly rather than silently reaching out.
  NO_PROXY: "*"

jobs:
  # ── 1. both runners, on the interpreter range the package claims ──────────
  test:
    name: tests (python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          # The newest interpreter is where the project actually runs, so it is
          # tested even though the classifier list stops at 3.13.
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The package must be INSTALLED, not merely checked out. The suite lives
      # in `tests/` and imports `opencsi` from `src/`; `pytest` finds that via
      # `pythonpath = ["src"]` in pyproject.toml, but `unittest` reads no
      # configuration file at all -- so the unittest step below resolved
      # `opencsi` only if the developer machine happened to have an editable
      # install. On a clean CI checkout it did not, and eleven jobs failed with
      # `ModuleNotFoundError: No module named 'opencsi'`.
      #
      # `--no-deps` is deliberate: the package declares no runtime dependencies,
      # so installing them would hide the exact regression the `stdlib-only` job
      # exists to catch.
      - name: Install the package under test
        run: python -m pip install -e . --no-deps

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest Pillow

      # Pillow is installed for the *tests*, not for the package. The package
      # declares no runtime dependency on it -- it is the optional `qr` extra --
      # but the QR rendering tests inspect a real WeChat code fixture and measure
      # its dot pitch, which cannot be done without an image library. Without
      # this, seven of them error with `ModuleNotFoundError: No module named
      # 'PIL'` on a clean runner, which is what CI was reporting.
      #
      # `--no-deps` on the package install above is what keeps that distinction
      # honest: the package still has to import on an air-gapped machine, and the
      # `stdlib-only` job is what proves it.
      - name: Confirm Pillow is available to the rendering tests
        run: python -c "import PIL; print('Pillow', PIL.__version__)"

      # A guard, not a formality: this is the step whose absence caused the
      # failure above, and a silent no-op install would restore it.
      - name: The package is importable from a clean checkout
        run: |
          python -c "
          import opencsi
          print('opencsi', opencsi.__version__ if hasattr(opencsi, '__version__') else '', 'from', opencsi.__file__)
          "

      # unittest is not redundant with pytest. The suite is written to run under
      # both, and pytest's collection does not exercise `unittest.main()` or the
      # module-level imports the same way. A test that passes under one and fails
      # under the other is a real bug in the test, and this is the only place it
      # would be caught.
      - name: unittest
        run: python -m unittest discover -s tests -t tests -v

      - name: pytest
        run: python -m pytest -q

      # §42 asks for these by name. They are inside `pytest` above, so this is
      # redundant by construction -- which is the point: a future edit that
      # excludes them from the default run (a marker, a testpaths change) would
      # silently drop the only coverage the startup-registration fix has, and
      # that fix is what stops sign-in from launching a program that does
      # nothing. Named separately so the loss would be visible.
      - name: startup helper tests
        run: python -m pytest tests/test_tray.py -q -k "Startup"

      - name: packaging tests
        run: python -m pytest tests/test_packaging.py -q

  # ── 2. the package must import with zero third-party dependencies ────────
  stdlib-only:
    name: import with no optional extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The package declares `dependencies = []` on purpose: it has to run on an
      # air-gapped Windows machine with no package index. That promise is easy to
      # break by adding one convenient import, and nothing else would notice,
      # because every developer machine has Pillow and pystray installed.
      #
      # `--no-deps` is the whole point of the job: installing the package *with*
      # its extras would import nothing wrong, but it would also put PIL and
      # pystray on the path, so a stray top-level import would stop being an
      # error. Installing with no dependencies keeps the tree as bare as an
      # air-gapped machine's.
      - name: Install the package with no dependencies
        run: python -m pip install -e . --no-deps

      - name: The CLI must import with only the standard library
        run: |
          python -c "
          import sys
          import opencsi
          for name in ('PIL', 'pystray', 'segno', 'requests'):
              assert name not in sys.modules, f'{name} was imported at package import time'
          print('opencsi imported with no third-party modules loaded')
          "

      # Run through the console-script entry point rather than `-m`, because that
      # is what the installed tool actually invokes -- and `python -m opencsi`
      # would additionally require a `__main__.py` that the package does not have.
      - name: --help must work without the optional extras
        run: |
          python -c "
          import sys
          from opencsi.cli.app import main
          sys.exit(main(['--help']))
          "

  # Syntax is version-dependent and the matrix jobs only discover it late, one
  # interpreter at a time and buried in a 1000-test log. Two probe scripts used an
  # f-string containing `r'\s+'` inside the expression part, which is a
  # SyntaxError before Python 3.12: on 3.10/3.11 those files failed to *parse*, so
  # the tests that read them for their safety posture errored instead of passing.
  #
  # Compiling every file against the oldest supported interpreter first gives a
  # one-line answer. 3.10 is the floor because pyproject declares
  # `requires-python = ">=3.10"`.
  oldest-supported-syntax:
    name: every file compiles on Python 3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile every Python file
        run: |
          python -m compileall -q src tools tests
          echo "compiled cleanly on $(python -V)"

  # ── 3. no credentials may ever be committed ──────────────────────────────
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This scans the *working tree* for the shapes a real credential takes. The
      # project's whole contract is that secrets are never printed, logged or
      # stored, and a contract that is only checked by hand is a contract that
      # eventually breaks.
      #
      # The patterns are deliberately narrow: a broad "long string" rule would
      # match base64 test fixtures and be ignored within a week. The script is
      # also runnable locally, and each pattern was verified to *catch* a planted
      # secret before being trusted -- a scan that passes vacuously is worthless.
      - name: Scan for credential-shaped strings
        run: bash tools/ci_secret_scan.sh

  # ── 4. the probes must declare their safety posture ──────────────────────
  probe-posture:
    name: probe safety posture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installed for the same reason the `test` job installs it: these tests
      # import `opencsi`, and relying on pytest's `pythonpath` setting alone made
      # this job's result depend on which directory pytest happened to pick as
      # its rootdir. An explicit install removes that dependency.
      - name: Install the package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install pytest

      # `tools/probe_*.py` reach a live service and can change real state. Every
      # one must declare its posture so nobody has to read the whole file to find
      # out before running it.
      #
      # This used to be `-k posture`, which selects by *name*: it silently ran
      # whichever tests happened to contain that substring, and would have gone
      # on passing if the real labels file were renamed or, worse, deselected.
      # The file is now named explicitly. `test_live_probe_labels.py` is the
      # contract -- presence, well-formedness, and agreement with the code --
      # and `test_packaging.py` carries the packaging-side posture check.
      - name: Every probe declares its posture
        run: |
          python -m pytest \
            tests/test_live_probe_labels.py \
            tests/test_packaging.py \
            tests/test_repository_hygiene.py \
            -q

      # The labels are declared as data (`#: labels: LIVE, NETWORK, ...`) and the
      # static analysis only looks for contradictions. This prints the whole
      # table, so a reader of the CI log sees the posture of every probe rather
      # than only that the assertion passed.
      - name: Print the probe label table
        run: python tools/live_probe_labels.py

  # ── 5. the frozen binaries must actually start ───────────────────────────
  frozen:
    name: frozen binaries (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and runtime extras
        run: python -m pip install --upgrade pip pyinstaller Pillow pystray segno

      - name: Build the standalone binaries
        run: python tools/build_exe.py

      # The point of this job. A frozen build is an independent test object: it
      # has a different import system, no source tree, and no `sys.path` entry for
      # `src`. A build that succeeds but produces a binary which cannot start is a
      # failure that only running it can detect -- and it is exactly the failure
      # that shipped once already, because the frozen tray resolved a startup
      # command pointing at a binary that did not exist.
      - name: The frozen CLI must run
        shell: pwsh
        run: |
          # Addressed explicitly rather than by `Get-ChildItem -Recurse | Select
          # -First 1`. A recursive search can return a PyInstaller *build*
          # intermediate -- build/opencsi/.../opencsi.exe is not the shipped
          # artifact and does not have the bundled runtime -- so the job could
          # pass while the real dist binary was broken, or vice versa. The
          # destination is fixed by tools/build_exe.py (--distpath defaults to
          # <root>/dist), so it is named directly.
          $cli = Resolve-Path "dist\opencsi.exe" -ErrorAction SilentlyContinue
          if (-not $cli) { throw "dist\opencsi.exe was not produced" }
          Write-Host "using $($cli.Path)"
          & $cli.Path --version
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
          & $cli.Path --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }

      - name: The frozen tray must run
        shell: pwsh
        run: |
          $tray = Resolve-Path "dist\opencsi-tray.exe" -ErrorAction SilentlyContinue
          if (-not $tray) { throw "dist\opencsi-tray.exe was not produced" }
          Write-Host "using $($tray.Path)"
          # §43 names both of these. `--help` proves the windowed binary can
          # parse arguments at all; a windowed build that cannot is a build whose
          # every other invocation fails silently, because it has no console to
          # print the traceback to.
          & $tray.Path --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "tray --help exited $LASTEXITCODE" }
          # `--check` proves the icon and menu can be constructed, then exits.
          # It touches no network, so it cannot hang waiting for an API.
          #
          # NOTE: no `tray` prefix. This binary *is* the tray, so its arguments go
          # straight to the tray sub-command; `opencsi-tray.exe tray --check`
          # would double the sub-command. The entry point now tolerates that too,
          # but CI asserts the canonical form.
          & $tray.Path --check
          if ($LASTEXITCODE -ne 0) { throw "tray --check exited $LASTEXITCODE" }

      - name: The frozen CLI must register the tray, not itself
        shell: pwsh
        run: |
          # §32/§62. The defect this guards is silent: an entry naming
          # opencsi.exe with no sub-command looks healthy in Task Manager and
          # does nothing at sign-in.
          $cli = Resolve-Path "dist\opencsi.exe"
          $tray = Resolve-Path "dist\opencsi-tray.exe"

          # `--json` is used because it carries the *source label*, which the
          # human-readable form renders as prose. Grepping the text output for
          # 'frozen-cli-tray' is what this step used to do, and it failed on a
          # build that was behaving correctly -- the label is never printed
          # verbatim. Asserting against unprinted text tests nothing.
          $raw = & $cli.Path tray --startup-status --json 2>&1 | Out-String
          Write-Host $raw
          if ($LASTEXITCODE -ne 0) { throw "tray --startup-status exited $LASTEXITCODE" }

          $doc = $raw | ConvertFrom-Json
          Write-Host "source: $($doc.source)"
          if ($doc.source -ne 'frozen-cli-tray') {
            throw "expected the frozen-cli-tray source, got: $($doc.source)"
          }
          # Nothing is registered on a runner, so the answer to "what would run?"
          # comes back as `would_run`. A build that registered something would
          # report `command` instead.
          $cmd = if ($doc.command) { $doc.command } else { $doc.would_run }
          Write-Host "would run: $cmd"
          if (-not $cmd) { throw "the report named no command at all" }
          if ($cmd -notmatch [regex]::Escape($tray.Path.Split('\')[-1])) {
            throw "the CLI did not name the tray binary as what it would run: $cmd"
          }
          # And it must never be the bare CLI: that is the original defect.
          if ($cmd -match '(?i)\\opencsi\.exe') {
            throw "the registered command is the bare CLI, not the tray: $cmd"
          }

          # Read-only: this only asks what *would* run. Installing the entry is
          # not done here, because a CI runner's registry is not ours to change.

      # The frozen binaries are the artifact users actually run, and they are a
      # different test object from the source tree: a separate import system, no
      # `src/` on sys.path, and no optional extras unless the spec bundles them.
      # This is where the durable-credential store must also work, because a
      # frozen build resolving a path relative to the source checkout would
      # silently store credentials somewhere nobody looks.
      - name: The frozen CLI reports its credential store
        shell: pwsh
        run: |
          $cli = Resolve-Path "dist\opencsi.exe"
          # `--no-store` makes this a purely local check: the frozen build must
          # be able to *find* the credential store and report its state without a
          # signed-in user and without reaching the network. A CI runner has
          # neither a stored credential nor opencsitool.com, so a check that
          # required either would fail for reasons that say nothing about the
          # build.
          $out = & $cli.Path login --status --no-store 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "login --status exited $LASTEXITCODE" }

          # The frozen build must resolve the store path relative to the user's
          # profile, not to the unpacked bundle. A `_MEIPASS`-relative path would
          # put credentials somewhere nobody looks, and would look correct here
          # while silently losing them between runs.
          $logout = & $cli.Path logout --no-store 2>&1 | Out-String
          Write-Host $logout
          # --no-store on logout is a usage error, deliberately: it says there is
          # nothing to clear rather than pretending to have cleared something.
          if ($LASTEXITCODE -eq 0) {
            throw "logout --no-store should refuse, not silently report success"
          }

      - name: The frozen CLI can list its own commands
        shell: pwsh
        run: |
          $cli = Resolve-Path "dist\opencsi.exe"
          $out = & $cli.Path --help 2>&1 | Out-String
          Write-Host $out
          # Named explicitly because `logout` is new this round and a build that
          # did not pick up the module would still pass every other check.
          foreach ($command in @('login', 'logout', 'usage', 'doctor', 'tray')) {
            if ($out -notmatch "\b$command\b") { throw "the help output omits '$command'" }
          }

      - name: Upload the binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-binaries
          path: |
            dist/**
          if-no-files-found: warn
          retention-days: 7

  # ── 6. the tree must be clean of generated junk ──────────────────────────
  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install pytest

      - name: No compiled artefacts are committed
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(__pycache__|\.pyc$|\.pyo$|\.egg-info|^dist/|^build/)'; then
            echo "::error::compiled or generated files are tracked"; exit 1
          fi
          echo "no generated files are tracked"

      # The checkout must be a full clone for this: the line-ending check reads
      # the committed blobs back out of HEAD, and the default shallow clone has
      # no usable HEAD tree to compare against.
      - name: The committed tree is LF-normalized
        run: python -m pytest tests/test_repository_hygiene.py -q

      - name: Every Python file compiles
        run: python -m compileall -q src tools tests
