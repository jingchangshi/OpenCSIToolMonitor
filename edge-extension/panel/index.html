<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCSI</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<main id="panel" class="panel" aria-live="polite">
  <header class="head">
    <span class="title">OpenCSI</span><span class="src">公司服务</span>
    <span class="spacer"></span>
    <span class="dot" id="dot" role="status"></span>
    <span class="state-text hidden" id="stateText"></span>
  </header>
  <p class="reason hidden" id="reason"></p>

  <section class="numbers" id="numbers">
    <div class="metric">
      <span class="label">今日 Tokens</span>
      <span class="big" id="todayTokens">--</span>
    </div>
    <div class="metric right" id="costMetric">
      <span class="label">今日估算费用</span>
      <span class="big" id="todayCost">--</span>
    </div>
  </section>

  <div class="sub hidden" id="subLine"></div>
  <div class="model-rows hidden" id="modelRows"></div>
  <button id="expandBtn" class="viewall hidden" type="button">另 N 个模型 · 查看详情</button>

  <footer class="foot">
    <span class="muted" id="updated">…</span>
    <span class="spacer"></span>
    <button id="refreshBtn" class="iconlink" type="button" title="立即刷新" aria-label="立即刷新">⟳</button>
    <button id="diagLink" class="iconlink" type="button" title="诊断报告" aria-label="打开诊断报告">ⓘ</button>
  </footer>
  <button id="loginBtn" class="action" type="button" hidden>重新登录 OpenCSI</button>
</main>
<script src="../core/models.js"></script>
<script src="../core/aggregation.js"></script>
<script src="../core/date.js"></script>
<script src="../core/state.js"></script>
<script src="../core/formatting.js"></script>
<script src="../core/resize.js"></script>
<script src="panel.js"></script>
</body>
</html>
