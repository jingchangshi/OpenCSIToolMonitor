<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公司 OpenCSI 用量</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<main id="panel" class="panel" aria-live="polite">
  <header class="head">
    <span class="title">OpenCSI · 公司用量</span>
    <span class="badge">外部数据</span>
    <span class="spacer"></span>
    <span class="dot" id="dot"></span>
    <span class="state" id="state">加载中</span>
    <button id="diagLink" class="subtle" type="button" title="打开诊断报告">诊断</button>
  </header>
  <div class="reason hidden" id="reason"></div>

  <section class="numbers">
    <div class="metric">
      <span class="label">今日 Tokens</span>
      <span class="big" id="todayTokens">--</span>
    </div>
    <div class="metric right">
      <span class="label">今日估算费用</span>
      <span class="big" id="todayCost">--</span>
    </div>
  </section>

  <div class="sub hidden" id="subLine"></div>
  <div class="sub detail hidden" id="freshLine"></div>
  <div class="model-rows hidden" id="modelRows"></div>

  <footer class="foot">
    <span class="muted" id="updated">最近更新：--:--</span>
    <span class="spacer"></span>
    <button id="refreshBtn" class="link" type="button">刷新</button>
    <button id="expandBtn" class="link" type="button" hidden>详情</button>
    <button id="loginBtn" class="action" type="button" hidden>重新登录 OpenCSI</button>
  </footer>
</main>
<script src="../core/models.js"></script>
<script src="../core/aggregation.js"></script>
<script src="../core/date.js"></script>
<script src="../core/state.js"></script>
<script src="../core/formatting.js"></script>
<script src="../core/resize.js"></script>
<script src="panel.js"></script>
</body>
</html>
